name: Chunk Quality Report
description: Report an issue with chunk quality
labels: ["chunk-quality"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the chunk quality issue
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository
      description: The repository where the issue was observed
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Provide an example of the problematic chunk
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Chunking
      description: How should the chunk have been split?
